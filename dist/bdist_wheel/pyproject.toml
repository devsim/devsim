[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devsim"
version = "2.12.0"
description = "DEVSIM: TCAD Device Simulator"
dynamic = ["readme"]
authors = [{ name = "DEVSIM LLC", email = "info@devsim.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
"Bug Tracker" = "https://github.com/devsim/devsim/issues"
Documentation = "https://devsim.net"
"Source Code" = "https://github.com/devsim/devsim"
"Online Forum" = "https://forum.devsim.org"

[tool.setuptools]
package-dir = { "" = "lib" }
packages = ["devsim", "devsim.python_packages", "devsim.umfpack"]
include-package-data = false

[tool.setuptools.package-data]
devsim = ["*.so", "*.dll", "*.dylib", "*.pyd"]
"devsim.umfpack" = ["*.so", "*.dll", "*.dylib", "*.pyd"]
